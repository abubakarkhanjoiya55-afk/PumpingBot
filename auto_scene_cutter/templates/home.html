<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0e10" />
  <title>SceneCut Pro</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}?v={{ asset_v }}" />
</head>
<body>
  <div class="home">
    <div class="home-bg" aria-hidden="true"></div>

    <header class="home-top">
      <a class="home-brand" href="/" title="SceneCut Pro website">
        <div class="home-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.2">
            <path d="M4 7h10l6 5-6 5H4V7z"/><path d="M9 7v10"/>
          </svg>
        </div>
        <strong>SceneCut Pro</strong>
      </a>
      <div class="home-top-actions">
        <span class="ghost-btn" id="liveBadge" hidden style="cursor:default;opacity:.8;">Live</span>
        <button type="button" class="ghost-btn" id="btnHomeOpen">Open</button>
        <button type="button" class="ghost-btn" id="btnQuitHome" hidden>Quit</button>
      </div>
    </header>

    <main class="home-main">
      <section class="hero-block">
        <p class="hero-kicker">AI Movie Explanation Editor</p>
        <h1 class="hero-brand">SceneCut Pro</h1>
        <p class="hero-sub">Movie + SRT se scenes auto-cut — CapCut jaisi simple start.</p>
        <div class="hero-ctas">
          <button type="button" class="cta-primary" id="btnNewProject">
            <span class="cta-plus" aria-hidden="true">+</span>
            New project
          </button>
          <button type="button" class="cta-secondary" id="btnOpenProject">Open project</button>
        </div>
      </section>

      <section class="recent-block" aria-label="Recent projects">
        <div class="recent-head">
          <h2>Recent projects</h2>
          <button type="button" class="linkish" id="btnSample">Try sample</button>
        </div>
        <div class="recent-grid" id="recentGrid">
          <div class="recent-empty" id="recentEmpty">Abhi koi project nahi — New project se shuru karo.</div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal" id="nameModal" hidden>
    <div class="modal-card" role="dialog" aria-labelledby="nameTitle">
      <h3 id="nameTitle">New project</h3>
      <p>Project ka naam likho</p>
      <input id="projectNameInput" type="text" maxlength="80" placeholder="My Project 01" autocomplete="off" />
      <div class="modal-actions">
        <button type="button" class="cta-secondary" id="btnNameCancel">Cancel</button>
        <button type="button" class="cta-primary" id="btnNameCreate">Create</button>
      </div>
    </div>
  </div>

  <div class="modal" id="openModal" hidden>
    <div class="modal-card wide" role="dialog" aria-labelledby="openTitle">
      <h3 id="openTitle">Open project</h3>
      <div class="open-list" id="openList"></div>
      <div class="modal-actions">
        <button type="button" class="cta-secondary" id="btnOpenCancel">Close</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/updater.js') }}?v={{ asset_v }}"></script>
  <script src="{{ url_for('static', filename='js/home.js') }}?v={{ asset_v }}"></script>
</body>
</html>
