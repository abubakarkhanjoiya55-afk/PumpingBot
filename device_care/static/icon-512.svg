<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Crypto Pumping Signals">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061018"/>
      <stop offset="55%" stop-color="#0a2a32"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="mark" x1="20%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- signal rings -->
  <circle cx="256" cy="268" r="148" fill="none" stroke="#2dd4bf" stroke-opacity="0.18" stroke-width="10"/>
  <circle cx="256" cy="268" r="108" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="8"/>
  <!-- candle body -->
  <rect x="226" y="210" width="60" height="150" rx="12" fill="url(#mark)"/>
  <!-- wicks -->
  <rect x="248" y="140" width="16" height="70" rx="8" fill="url(#gold)"/>
  <rect x="248" y="360" width="16" height="48" rx="8" fill="#0f766e"/>
  <!-- pump arrow -->
  <path d="M256 118 L310 190 L278 190 L278 210 L234 210 L234 190 L202 190 Z" fill="url(#gold)"/>
  <!-- pulse dots -->
  <circle cx="150" cy="250" r="10" fill="#2dd4bf" opacity="0.85"/>
  <circle cx="362" cy="250" r="10" fill="#38bdf8" opacity="0.85"/>
  <circle cx="128" cy="310" r="7" fill="#2dd4bf" opacity="0.55"/>
  <circle cx="384" cy="310" r="7" fill="#38bdf8" opacity="0.55"/>
</svg>
