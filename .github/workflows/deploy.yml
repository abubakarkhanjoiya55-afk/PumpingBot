name: Deploy PumpingBot

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VITE_API_URL: https://web-production-c78a0.up.railway.app

jobs:
  railway-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.2.0

      - name: Deploy / configure PumpingBot (proactive-healing)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_BOT_PROJECT_ID: ${{ secrets.RAILWAY_BOT_PROJECT_ID }}
          RAILWAY_BOT_SERVICE: ${{ secrets.RAILWAY_BOT_SERVICE || 'web' }}
          RAILWAY_BOT_ENVIRONMENT: ${{ secrets.RAILWAY_BOT_ENVIRONMENT || 'production' }}
          VPS_SECRET: ${{ secrets.VPS_SECRET || 'pumpingbot-vps-live-2026' }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN secret missing — bot relies on GitHub auto-deploy to proactive-healing"
            exit 0
          fi
          chmod +x scripts/railway-deploy-bot.sh
          ./scripts/railway-deploy-bot.sh

  vercel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: client
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret missing — skipping Vercel deploy"
            exit 0
          fi
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_URL: ${{ env.VITE_API_URL }}
        working-directory: client
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then exit 0; fi
          vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: client
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then exit 0; fi
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
