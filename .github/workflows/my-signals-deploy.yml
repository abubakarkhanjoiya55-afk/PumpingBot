name: Deploy Crypto Pumping Signals (My Signals)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "device_care/**"
      - "my_signals_service/**"
      - "scripts/railway-deploy-my-signals.sh"
      - ".github/workflows/my-signals-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.2.0

      - name: Deploy Crypto Pumping Signals
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_MY_SIGNALS_SERVICE: ${{ secrets.RAILWAY_MY_SIGNALS_SERVICE || 'web' }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN missing — relying on Railway GitHub auto-deploy / PumpingBot embed"
            exit 0
          fi
          chmod +x scripts/railway-deploy-my-signals.sh
          ./scripts/railway-deploy-my-signals.sh
